<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlideCraft — Вход</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at top, #1a1f2e 0%, #0f1117 60%);
      color: #e6e6e6;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #1f2330;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.04);
      width: 380px;
      max-width: 100%;
    }
    .brand {
      text-align: center;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .brand .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a7cff, #ff8c42);
      margin-right: 8px;
      vertical-align: middle;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }
    .sub {
      opacity: 0.6;
      margin-bottom: 18px;
      font-size: 13px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      background: #15171f;
      padding: 4px;
      border-radius: 8px;
    }
    .tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      border: none;
      background: transparent;
      color: #999;
      cursor: pointer;
      border-radius: 6px;
      font: inherit;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .tab:hover { color: #ccc; }
    .tab.active {
      background: #2d3346;
      color: #fff;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: -6px;
    }
    input {
      padding: 11px 12px;
      border-radius: 7px;
      border: 1px solid #3a3f4f;
      background: #15171f;
      color: #fff;
      font: inherit;
      width: 100%;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #4a7cff;
    }
    button[type="submit"] {
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: linear-gradient(135deg, #4a7cff, #6e8fff);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.05s, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(74, 124, 255, 0.35);
    }
    button[type="submit"]:hover {
      box-shadow: 0 6px 20px rgba(74, 124, 255, 0.5);
    }
    button[type="submit"]:active {
      transform: translateY(1px);
    }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .msg {
      font-size: 13px;
      min-height: 18px;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: center;
    }
    .msg.error {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
    }
    .msg.success {
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
    }
    .hint {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #2a2f3d;
      font-size: 11px;
      opacity: 0.5;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span>SlideCraft</div>
    <h1 id="title">Вход</h1>
    <div class="sub" id="subtitle">Войди или зарегистрируйся, чтобы продолжить</div>

    <div class="tabs">
      <button type="button" class="tab active" id="tabLogin">Вход</button>
      <button type="button" class="tab" id="tabRegister">Регистрация</button>
    </div>

    <form id="form" autocomplete="off">
      <div>
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" placeholder="минимум 3 символа" required minlength="3" maxlength="32" autocomplete="username">
      </div>
      <div>
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="минимум 6 символов" required minlength="6" autocomplete="current-password">
      </div>
      <div class="msg" id="msg"></div>
      <button type="submit" id="submitBtn">Войти</button>
    </form>

    <div class="hint">
      Данные хранятся локально на сервере (users.json). Пароль хешируется
      PBKDF2-HMAC-SHA256 (100 000 итераций). Сессия — 30 дней в HttpOnly-куке.
    </div>
  </div>

  <script>
    let mode = "login";
    const $ = (id) => document.getElementById(id);

    function setMode(m) {
      mode = m;
      $("tabLogin").classList.toggle("active", m === "login");
      $("tabRegister").classList.toggle("active", m === "register");
      $("title").textContent = m === "login" ? "Вход" : "Регистрация";
      $("subtitle").textContent = m === "login"
        ? "Войди, чтобы продолжить"
        : "Создай аккаунт, чтобы продолжить";
      $("submitBtn").textContent = m === "login" ? "Войти" : "Зарегистрироваться";
      $("password").autocomplete = m === "login" ? "current-password" : "new-password";
      const msg = $("msg");
      msg.textContent = "";
      msg.className = "msg";
    }

    $("tabLogin").addEventListener("click", () => setMode("login"));
    $("tabRegister").addEventListener("click", () => setMode("register"));

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = $("username").value.trim();
      const password = $("password").value;
      const msg = $("msg");
      const btn = $("submitBtn");
      msg.textContent = "";
      msg.className = "msg";
      btn.disabled = true;
      btn.textContent = mode === "login" ? "Входим…" : "Регистрируем…";

      try {
        const res = await fetch("/" + mode, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        let data;
        try { data = await res.json(); }
        catch { data = { error: "Некорректный ответ сервера" }; }

        if (res.ok && data.ok) {
          msg.className = "msg success";
          msg.textContent = mode === "register"
            ? "Аккаунт создан, входим…"
            : "Вход выполнен, переходим…";
          setTimeout(() => { window.location.href = "/"; }, 400);
        } else {
          msg.className = "msg error";
          msg.textContent = data.error || "Ошибка";
          btn.disabled = false;
          btn.textContent = mode === "login" ? "Войти" : "Зарегистрироваться";
        }
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Сетевая ошибка: " + err.message;
        btn.disabled = false;
        btn.textContent = mode === "login" ? "Войти" : "Зарегистрироваться";
      }
    });

    $("username").focus();
  </script>
</body>
</html>
